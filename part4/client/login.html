<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBnB Plus | Login</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="login" class="auth-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-5 col-md-8">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-lg-5">
            <a href="index.html" class="text-decoration-none text-danger fw-bold d-inline-block mb-4">← Back to home</a>
            <h1 class="h3 fw-bold mb-3">Welcome back</h1>
            <p class="text-muted">Sign in to book places, manage your stays, and access the admin dashboard.</p>
            <form id="login-form" class="mt-4">
              <div class="mb-3"><label class="form-label">Email</label><input id="email" type="email" class="form-control" required></div>
              <div class="mb-3"><label class="form-label">Password</label><input id="password" type="password" class="form-control" required></div>
              <button class="btn btn-danger w-100">Login</button>
              <div id="error-message" class="small text-danger mt-3"></div>
            </form>
            <div class="alert alert-light border mt-4 mb-0 small">
              <strong>Demo accounts</strong><br>Admin: admin@example.com / 123456<br>Guest: guest@example.com / 123456
            </div>
            <p class="text-center mt-4 mb-0">New here? <a href="register.html">Create an account</a></p>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="scripts.js"></script>
</body>
</html>
