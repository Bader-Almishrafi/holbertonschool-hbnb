<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBnB Plus | Admin dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="admin">
    <nav class="navbar navbar-expand-lg bg-dark navbar-dark sticky-top">
      <div class="container">
        <a
          class="navbar-brand fw-bold text-danger d-flex align-items-center"
          href="index.html">
          <img
            src="images/logo.png"
            alt="logo"
            style="height: 35px; margin-right: 8px" />
        </a>
        <div class="ms-auto">
          <button id="logout-btn" class="btn btn-danger">Logout</button>
        </div>
      </div>
    </nav>
    <main class="container py-5">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h1 class="h3 fw-bold mb-1">Admin dashboard</h1>
          <p class="text-muted mb-0">
            High-level overview of users, listings, bookings, and revenue.
          </p>
        </div>
      </div>
      <div id="admin-stats" class="row g-4 mb-5"></div>
      <div class="row g-4 mb-5">
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body">
              <h2 class="h5 fw-bold">Booking status mix</h2>
              <canvas id="booking-status-chart" height="230"></canvas>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body">
              <h2 class="h5 fw-bold">Revenue by month</h2>
              <canvas id="monthly-revenue-chart" height="230"></canvas>
            </div>
          </div>
        </div>
        <div class="col-lg-4">
          <div class="card border-0 shadow-sm rounded-4 h-100">
            <div class="card-body">
              <h2 class="h5 fw-bold">Top cities by listings</h2>
              <canvas id="top-cities-chart" height="230"></canvas>
            </div>
          </div>
        </div>
      </div>
      <div class="row g-4">
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body">
              <h2 class="h5 fw-bold">Latest users</h2>
              <div class="table-responsive">
                <table
                  class="table align-middle"
                  id="admin-users-table"></table>
              </div>
            </div>
          </div>
        </div>
        <div class="col-lg-6">
          <div class="card border-0 shadow-sm rounded-4">
            <div class="card-body">
              <h2 class="h5 fw-bold">Latest bookings</h2>
              <div class="table-responsive">
                <table
                  class="table align-middle"
                  id="admin-bookings-table"></table>
              </div>
            </div>
          </div>
        </div>
      </div>
    </main>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.3/dist/chart.umd.min.js"></script>
    <script src="scripts.js"></script>
  </body>
</html>
