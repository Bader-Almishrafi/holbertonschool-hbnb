<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBnB Plus | Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body data-page="register" class="auth-page">
  <div class="container py-5">
    <div class="row justify-content-center">
      <div class="col-lg-6 col-md-9">
        <div class="card shadow-lg border-0 rounded-4">
          <div class="card-body p-4 p-lg-5">
            <a href="index.html" class="text-decoration-none text-danger fw-bold d-inline-block mb-4">← Back to home</a>
            <h1 class="h3 fw-bold mb-3">Create your account</h1>
            <p class="text-muted">Start booking stays or listing your own place as a host.</p>
            <form id="register-form" class="mt-4">
              <div class="row g-3">
                <div class="col-md-6"><label class="form-label">First name</label><input id="first_name" class="form-control" required></div>
                <div class="col-md-6"><label class="form-label">Last name</label><input id="last_name" class="form-control" required></div>
                <div class="col-12"><label class="form-label">Email</label><input id="register_email" type="email" class="form-control" required></div>
                <div class="col-12"><label class="form-label">Password</label><input id="register_password" type="password" class="form-control" required></div>
              </div>
              <button class="btn btn-danger w-100 mt-4">Create account</button>
              <div id="register-message" class="small mt-3"></div>
            </form>
          </div>
        </div>
      </div>
    </div>
  </div>
  <script src="scripts.js"></script>
</body>
</html>
