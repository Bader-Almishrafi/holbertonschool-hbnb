<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HBnB | My places</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body data-page="my-places">
    <nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top">
      <div class="container">
        <a
          class="navbar-brand fw-bold text-danger d-flex align-items-center"
          href="index.html">
          <img
            src="images/logo.png"
            alt="logo"
            style="height: 35px; margin-right: 8px" />
        </a>
        <div class="ms-auto d-flex gap-2">
          <a href="bookings.html" class="btn btn-outline-secondary"
            >My Bookings</a
          ><button id="logout-btn" class="btn btn-danger">Logout</button>
        </div>
      </div>
    </nav>
    <main class="container py-5">
      <div class="row g-4">
        <div class="col-lg-5">
          <div class="card border-0 shadow-sm rounded-4" id="add-place">
            <div class="card-body p-4">
              <h1 class="h4 fw-bold">Host a new place</h1>
              <p class="text-muted">
                Create a listing with pricing, capacity, city, and cover image.
              </p>
              <form id="place-form">
                <div class="row g-3">
                  <div class="col-12">
                    <input
                      id="place_title"
                      class="form-control"
                      placeholder="Place title"
                      required />
                  </div>
                  <div class="col-12">
                    <textarea
                      id="place_description"
                      class="form-control"
                      placeholder="Description"
                      rows="4"></textarea>
                  </div>
                  <div class="col-md-6">
                    <input
                      id="place_price"
                      type="number"
                      class="form-control"
                      placeholder="Price per night"
                      required />
                  </div>
                  <div class="col-md-6">
                    <input
                      id="place_guests"
                      type="number"
                      class="form-control"
                      placeholder="Max guests"
                      value="2"
                      required />
                  </div>
                  <div class="col-md-6">
                    <input
                      id="place_city"
                      class="form-control"
                      placeholder="City"
                      value="Riyadh"
                      required />
                  </div>
                  <div class="col-md-6">
                    <input
                      id="place_country"
                      class="form-control"
                      placeholder="Country"
                      value="Saudi Arabia"
                      required />
                  </div>
                  <div class="col-md-6">
                    <input
                      id="place_latitude"
                      type="number"
                      step="0.0001"
                      class="form-control"
                      placeholder="Latitude"
                      value="24.7136"
                      required />
                  </div>
                  <div class="col-md-6">
                    <input
                      id="place_longitude"
                      type="number"
                      step="0.0001"
                      class="form-control"
                      placeholder="Longitude"
                      value="46.6753"
                      required />
                  </div>
                  <div class="col-12">
                    <input
                      id="place_image_url"
                      class="form-control"
                      placeholder="Image URL" />
                  </div>
                </div>
                <button class="btn btn-danger w-100 mt-4">Create place</button>
                <div id="place-message" class="small mt-3"></div>
              </form>
            </div>
          </div>
        </div>
        <div class="col-lg-7">
          <h2 class="h4 fw-bold mb-3">My hosted places</h2>
          <div id="my-places-list" class="row g-4"></div>
        </div>
      </div>
    </main>
    <script src="scripts.js"></script>
  </body>
</html>
